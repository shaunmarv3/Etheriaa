# India-common drugs that DDInter does not list (checked against the 1,939
# DDInter names on 2026-09-28). Each becomes a (:Drug {source: "curated"}) node
# with no DDInter id, so it can join drug classes and the class-level safety net
# (aceclofenac is an NSAID, so NSAID + warfarin covers it). DDInter-sourced
# pairs never exist for these: other combinations are reported "not found".
# Source: the WHO ATC/DDD index entry for the drug's ATC code.
# OWNER REVIEW REQUIRED (spec 6.5).
