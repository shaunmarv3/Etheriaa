# Drug classes (spec 6.1: (:Drug)-[:MEMBER_OF]->(:DrugClass), (:Condition)-[:FIRST_LINE]->(:DrugClass)).
# Members are DDInter drug names or extra_drugs.yaml names (checked by the seeder
# and tests/unit/test_curated.py).
# Classes are used for two things only: "first-line treatment class" facts on
# conditions (never doses, never a prescription), and expanding class-level
# critical interactions (critical_interactions.yaml) to member drugs.
# A class with no members is a non-drug measure (for example ORS).
# Membership source: WHO ATC classification (https://atcddd.fhi.no/atc_ddd_index/).
# OWNER REVIEW REQUIRED (spec 6.5).

