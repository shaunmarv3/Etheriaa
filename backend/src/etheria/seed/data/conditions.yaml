# India-common conditions (spec 6.1, 6.5). Each entry: an ICD-10-CM code (the
# seeder verifies it against NLM Clinical Tables and stores the official name),
# associated symptoms with weights in (0, 1] (how characteristic the symptom is),
# first-line treatment CLASSES (never a drug choice, never a dose), self-care
# and red flags, and a public source. Symptom codes -> symptoms.yaml; classes ->
# drug_classes.yaml. body_systems -> seed/curated.py BODY_SYSTEMS.
# OWNER REVIEW REQUIRED (spec 6.5): drafted 2026-09-28, not yet reviewed.

# ===================== infections =====================
