# Ingredient names as printed on Indian labels -> the DDInter drug name (spec 6.2).
# Only true renames live here. Salt suffixes ("metoprolol succinate") and
# British spellings ("sulphate", "aluminium") are handled in code
# (knowledge/text.py). Every canonical name is checked against DDInter by the
# seeder and by tests/unit/test_curated.py.
# Source for each rename: WHO INN list vs USAN (British Approved Name / INN on
# the left, the name DDInter uses on the right); checked 2026-09-28.
# OWNER REVIEW REQUIRED (spec 6.5).
